name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public values (see apps/web/.env.example); needed by the production build.
      NEXT_PUBLIC_SUPABASE_URL: https://hgptsobrurnlrtyagaje.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wlu_IgllYmuwkshwec4Fdw_2NleGfrc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    # RM-011: migrations apply on a fresh Supabase database and every RLS test passes (ARC-104).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase test db
      - name: Database types are up to date (pnpm db:types)
        run: pnpm db:types && git diff --exit-code apps/web/src/lib/database/types.ts

  e2e:
    # End-to-end tests of the web app against a local Supabase stack (accounts, credits, control tower).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,realtime,storage-api,edge-runtime,supavisor,postgres-meta
      - name: Local Supabase settings for the app (local keys only)
        run: |
          pnpm exec supabase status -o env > supabase.env
          . ./supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter @atlas/web build
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - run: pnpm --filter @atlas/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  generated-dbt:
    # RM-020/RM-021: the reference project generates a dbt project that dbt accepts and whose SQL is valid Snowflake.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/cli build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/generated-dbt/requirements.txt
      - run: scripts/generated-dbt/check.sh "$RUNNER_TEMP/dbt"
      # RM-021 offline: the generated models run on the fictitious data (DuckDB), dbt tests and expectations pass.
      - run: python scripts/reference-run/run_duckdb.py "$RUNNER_TEMP/dbt" examples/reference examples/reference-data
